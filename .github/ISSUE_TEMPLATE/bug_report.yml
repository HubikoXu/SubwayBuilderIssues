name: Bug Report
description: Report a bug or issue with Subway Builder
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Hi, I bought the game like a week ago, and after a few days the game doesn't load any save or even let me create a new one. It is just stuck on "loading map" screen.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. I open the game
        2. Click on anything that will try opening a save or creating one
        3. See the game not loading anything past "loading map" screen
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: The game doesn't load further
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS are you using?
      placeholder: Windows 10
    validations:
      required: true

  - type: input
    id: gameVersion
    attributes:
      label: Game Version
      description: What version of the game are you using? You can check this in the settings menu.
      placeholder: 0.7.6
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot
      description: If applicable, add a screenshot to help explain your problem (drag and drop or paste)
      placeholder: Drag and drop image here
    validations:
      required: false

  - type: textarea
    id: video
    attributes:
      label: Video
      description: If applicable, add a video showing the issue (drag and drop or paste a link)
      placeholder: Drag and drop video or paste link here
    validations:
      required: false

  - type: textarea
    id: savefile
    attributes:
      label: Save File
      description: Please attach your save file (drag and drop). Compress the file if it is too big to upload.
      placeholder: I don't know how to attach a save file. Or even if this is a correct way to contact you. (I tried asking abt it on discord but nobody trom the team reached out)
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
      placeholder: Any other details?
    validations:
      required: false
